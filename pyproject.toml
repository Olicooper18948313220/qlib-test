[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib-quant"
version = "0.1.0"
description = "Configurable stock selection and Qlib research workflow"
requires-python = ">=3.11,<3.13"
dependencies = ["pyyaml>=6.0", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9.7"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

