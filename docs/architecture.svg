<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">qlib_quant 当前框架结构</title>
  <desc id="desc">从 repaired SQLite 行情经过因子、信号、组合、回测到报告和网页的流程图，并标出 Qlib 适配接口和未接入的 YAML 配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#345"/>
    </marker>
    <marker id="arrowPending" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a66b00"/>
    </marker>
    <style>
      .box { fill:#e8f3ff; stroke:#2b6cb0; stroke-width:2; rx:12; }
      .pending { fill:#fff5db; stroke:#b7791f; stroke-width:2; stroke-dasharray:7 5; rx:12; }
      .data { fill:#eef8ee; stroke:#3c8c40; stroke-width:2; rx:12; }
      .title { font: 600 24px "Segoe UI", "Microsoft YaHei", sans-serif; fill:#17365d; }
      .label { font: 500 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill:#17365d; text-anchor:middle; }
      .small { font: 400 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill:#425466; text-anchor:middle; }
      .line { fill:none; stroke:#345; stroke-width:2.2; marker-end:url(#arrow); }
      .linePending { fill:none; stroke:#a66b00; stroke-width:2; stroke-dasharray:7 5; marker-end:url(#arrowPending); }
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="720" fill="#f8fafc"/>
  <text x="50" y="48" class="title">qlib_quant 当前框架结构</text>
  <text x="50" y="78" class="small" text-anchor="start">实线：当前回测链路　虚线：已准备但尚未接入主回测的接口</text>

