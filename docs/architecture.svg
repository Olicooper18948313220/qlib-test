  <text x="50" y="540" class="small" text-anchor="start">研究目标：年化收益 &gt; 40%，最大回撤 &lt; 15%（待修复记账、确认数据口径后验证）</text>
  <text x="50" y="575" class="small" text-anchor="start">价格使用后复权，成交价属于研究近似；数据库、完整行情和缓存不随代码仓库上传。</text>
