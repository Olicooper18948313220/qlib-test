  <rect x="750" y="150" width="205" height="90" class="box"/>
  <text x="852" y="188" class="label">signals/legacy_v1.py</text><text x="852" y="214" class="small">11条选股信号</text>
  <rect x="1010" y="150" width="190" height="90" class="box"/>
