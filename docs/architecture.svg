  <rect x="1255" y="150" width="190" height="90" class="box"/>
  <text x="1350" y="188" class="label">backtest/simple.py</text><text x="1350" y="214" class="small">周频、下一日开盘</text>

  <path d="M215 195 H270" class="line"/><path d="M450 195 H505" class="line"/><path d="M695 195 H750" class="line"/><path d="M955 195 H1010" class="line"/><path d="M1200 195 H1255" class="line"/>

  <rect x="1050" y="335" width="190" height="90" class="box"/>
