[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selectstock"
version = "0.1.0"
description = "Local-first US equity research and Martin Luk scanners"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "yfinance>=0.2.65,<2", "exchange-calendars>=4.5,<5", "PyYAML>=6,<7", "filelock>=3.12", "requests>=2.31", "matplotlib>=3.8", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
selectstock = "selectstock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "runs/.cache/pytest"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
