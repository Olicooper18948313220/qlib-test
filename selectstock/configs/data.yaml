provider: yahoo
database: data/market.sqlite3
output_dir: runs
end: null                         # null = 最近已收盘交易日
symbols: []                       # 空列表 = Nasdaq 股票目录中的全部合格证券
timeframes: [1d]
history_days: {1d: 730, 15m: 30, 5m: 30, 1m: 7}
read_bars: 252
batch_size: 25
request_pause_seconds: 0.4
retries: 3
retry_backoff_seconds: 2
metadata_ttl_days: 1
universe_ttl_days: 1
include_extended_hours: true
close_delay_minutes: 30
offline: false
